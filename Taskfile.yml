version: '3'

dotenv: ['.env']

vars:
  FLUTTER: flutter
  DEVICE: iPhone
  DART_DEFINES: >-
    --dart-define=REVENUECAT_IOS_API_KEY=$REVENUECAT_IOS_API_KEY
    --dart-define=REVENUECAT_ANDROID_API_KEY=$REVENUECAT_ANDROID_API_KEY
  RELEASE_DART_DEFINES: >-
    --dart-define=REVENUECAT_IOS_API_KEY=$REVENUECAT_IOS_API_KEY
    --dart-define=REVENUECAT_ANDROID_API_KEY=$REVENUECAT_ANDROID_API_KEY
  RELEASE_DEMO_DART_DEFINES: >-
    --dart-define=DEMO_MODE=true
    --dart-define=REVENUECAT_IOS_API_KEY=$REVENUECAT_IOS_API_KEY
    --dart-define=REVENUECAT_ANDROID_API_KEY=$REVENUECAT_ANDROID_API_KEY
  DEV_DART_DEFINES: >-
    {{.DART_DEFINES}}
    --dart-define=DEMO_MODE=true

tasks:
  default:
    desc: タスク一覧を表示
    cmds:
      - task --list

  run:
    desc: アプリを起動 (デモモード ON)
    cmds:
      - '{{.FLUTTER}} run -d {{.DEVICE}} {{.DEV_DART_DEFINES}}'

  run:prod:
    desc: アプリを起動 (デモモード OFF / Firebase 必須)
    cmds:
      - '{{.FLUTTER}} run -d {{.DEVICE}} {{.DART_DEFINES}}'

  stop:
    desc: 実行中のFlutterプロセスを停止
    cmds:
      - pkill -f "flutter run" || true

  restart:
    desc: アプリを再起動
    cmds:
      - task: stop
      - task: run

  devices:
    desc: 利用可能なデバイス一覧
    cmds:
      - '{{.FLUTTER}} devices'

  clean:
    desc: ビルドキャッシュをクリア
    cmds:
      - '{{.FLUTTER}} clean'
      - '{{.FLUTTER}} pub get'

  analyze:
    desc: コードを静的解析
    cmds:
      - '{{.FLUTTER}} analyze'

  test:
    desc: テストを実行
    cmds:
      - '{{.FLUTTER}} test'

  build:ios:
    desc: iOS リリースビルド (デモモード OFF)
    cmds:
      - '{{.FLUTTER}} build ipa --release {{.RELEASE_DART_DEFINES}}'

  build:ios:demo:
    desc: iOS リリースビルド (デモモード ON / 審査用)
    cmds:
      - '{{.FLUTTER}} build ipa --release {{.RELEASE_DEMO_DART_DEFINES}}'

  build:android:
    desc: Android リリースビルド (App Bundle, デモモード OFF)
    cmds:
      - '{{.FLUTTER}} build appbundle --release {{.RELEASE_DART_DEFINES}}'

  deps:
    desc: 依存パッケージをインストール
    cmds:
      - '{{.FLUTTER}} pub get'

  # ==================== Web (LP / Privacy / Terms) ====================

  web:dev:
    desc: LP の開発サーバを起動 (http://localhost:3000)
    dir: site
    cmds:
      - npm run dev

  web:build:
    desc: LP の静的ビルド (site/out へ出力)
    dir: site
    cmds:
      - npm run build

  web:deploy:
    desc: LP を Firebase Hosting へデプロイ
    cmds:
      - firebase deploy --only hosting

  web:install:
    desc: LP の npm 依存をインストール
    dir: site
    cmds:
      - npm install
